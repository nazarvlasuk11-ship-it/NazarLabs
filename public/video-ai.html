<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Освітній вебсайт про штучний інтелект: інструменти для генерації тексту, зображень та відео, навчальні матеріали та блог."
    />
    <title>Генерація відео</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <a href="tools.html">⬆️ Назад до інструментів</a>
    </nav>

    <main>
      <h2>Відео-нейромережі</h2>

      <details>
        <summary>Що таке Text-to-Video?</summary>
        <p>
          Це технологія, яка перетворює текстовий промпт на повноцінний
          відеоролик.
        </p>
      </details>
      <br />

      <label>Завантаженість серверів генерації:</label>
      <meter value="0.8" min="0" max="1" low="0.3" high="0.8" optimum="0.1">
        80%</meter
      ><br /><br />

      <label>Прогрес вашого відео:</label>
      <progress value="45" max="100">45%</progress>
    </main>
  </body>
</html>
