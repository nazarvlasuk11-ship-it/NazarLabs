<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Освітній вебсайт про штучний інтелект: інструменти для генерації тексту, зображень та відео, навчальні матеріали та блог."
    />
    <title>Профіль користувача — Блог</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="profile.js" defer></script>
  </head>
  <body>
    <nav>
      <a href="index.html">🔙 Повернутися на Головну сторінку</a><br /><br />
      <a href="blog.html">Повернутися до Блогу</a>
    </nav>

    <main>
      <!-- Форма входу (показується, якщо користувач НЕ авторизований) -->
      <section id="loginSection" class="section">
        <h2>Вхід</h2>
        <label for="loginEmail" class="sr-only">Email</label>
        <input
          id="loginEmail"
          class="blog-input"
          type="email"
          placeholder="Email"
          autocomplete="email"
        />

        <label for="loginPassword" class="sr-only">Пароль</label>
        <input
          id="loginPassword"
          class="blog-input"
          type="password"
          placeholder="Пароль"
          autocomplete="current-password"
        />
        <button class="publish-button" onclick="login()">Увійти</button>
        <p id="loginError" class="error-text"></p>
        <p>
          Немає акаунта?
          <a
            href="#"
            onclick="
              toggleForms();
              return false;
            "
            >Зареєструватися</a
          >
        </p>
      </section>

      <section id="registerSection" class="section" style="display: none">
        <h2>Реєстрація</h2>
        <label for="registerName" class="sr-only">Ім'я користувача</label>
        <input
          id="registerName"
          class="blog-input"
          type="text"
          placeholder="Ім'я користувача"
          autocomplete="username"
        />

        <label for="registerEmail" class="sr-only">Email</label>
        <input
          id="registerEmail"
          class="blog-input"
          type="email"
          placeholder="Email"
          autocomplete="email"
        />

        <label for="registerPassword" class="sr-only">Пароль</label>
        <input
          id="registerPassword"
          class="blog-input"
          type="password"
          placeholder="Пароль (мінімум 6 символів)"
          autocomplete="new-password"
        />
        <button class="publish-button" onclick="register()">
          Зареєструватися
        </button>
        <p id="registerError" class="error-text"></p>
        <p>
          Вже є акаунт?
          <a
            href="#"
            onclick="
              toggleForms();
              return false;
            "
            >Увійти</a
          >
        </p>
      </section>

      <section id="profileSection" class="section" style="display: none">
        <h2>Мій профіль</h2>
        <div class="profile-info">
          <p><b>Ім'я:</b> <span id="profileName"></span></p>
          <p><b>Email:</b> <span id="profileEmail"></span></p>
          <p><b>Зареєстрований:</b> <span id="profileCreatedAt"></span></p>
        </div>

        <h3>Про себе</h3>
        <label for="profileBio">Про себе</label>
        <textarea
          id="profileBio"
          class="blog-textarea"
          placeholder="Розкажіть трохи про себе..."
        ></textarea>
        <button class="publish-button" onclick="updateProfile()">
          Зберегти зміни
        </button>
        <p id="profileMessage" class="success-text"></p>

        <button class="logout-button" onclick="logout()">Вийти</button>
      </section>
    </main>
  </body>
</html>
